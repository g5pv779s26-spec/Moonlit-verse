const BOOK={"front": "﻿Author's note: This collection is not just poetry—it is pieces \nEach poem holds a moment I didn’t know how to say out loud, thoughts I tried to hide, and feelings that felt too heavy to carry alone. Some of these pages were written in pain, some in reflection, and some in the quiet moments in between where I was just trying to understand myself.\n\n\nThis book is for anyone who has ever felt like they were too much and not enough at the same time. For anyone who smiles on the outside but feels something completely different within. For anyone who is still learning how to heal.\n\n\nI am not perfect, and these poems are not meant to be. They are real. They are honest. They are mine.\n\n\nAnd maybe, in some way, they will feel like yours too.\n________________", "parts": [{"title": "The wake up", "text": "Part I: The wake up\n Rose \n\n\nLife is like a rose—\nbeautiful, soft, and sweet,\nyet painful all at once.\n\n\nThere is much to gain,\nthough sometimes\nthou mayst fall.\n\n\nStill, thou must rise again,\nand shine—\nbecoming the rose\nthou wert meant to be.\n\n\nThou may feel alone,\nbut remember—\nthere is more around thee\nthan thou can see.\n\n\nEven in darkness,\nthou shalt bloom.\nThough thorns may prick and wound,\nthou shalt not give up.\n\n\nFor even in sorrow,\nthou remainest\nbeautiful and sweet.\n\n\n________________\n\n\nLoud Silence\n\n\nI hate it.\nI hate me—\nwho I am,\nwho I was.\n\n\nI hate how I fail\nbefore I even begin.\n\n\nI’m going through so much,\nyet no one sees—\nno one understands\nhow loud it gets inside my head.\n\n\nI try to focus,\nbut my thoughts\npull me under—\nreminding me\nof everything I’ve done wrong.\n\n\nI call myself\na failure,\na mistake,\na person who can’t get it right.\n\n\nBut I’m trying.\nIsn’t that something?\n\n\nI am human—\nflawed, imperfect,\nstill learning.\n\n\nEven if it doesn’t feel like enough,\nit is the truth:\nI am still here,\nstill trying\nto become better.\n\n\n\n\n\n\nToo Loud Inside\n\n\nIt’s too loud in my head\nfor someone who says nothing.\n\n\nNot just noise—\nbut echoes.\n\n\nEvery mistake\nreplaying\nlike it just happened.\n\n\nEvery word\nI wish I could take back\nfinding its way\nto the front again.\n\n\nIt feels like\nbeing trapped in a room\nwhere the walls\nwon’t stop talking.\n\n\nAnd no matter\nhow quiet I sit—\n\n\nit never quiets back.\n\n\n________________\n\n\nTwo Versions of Me\n\n\nMentally, I am gone—\nburnt out,\nburied deep\nin a dark place\nno one can see.\n\n\nCrying,\nbreaking,\nnever quite the same.\n\n\nBut physically—\nI’m here.\n\n\nSmiling,\nlaughing,\nlooking like\nnothing is wrong.\n\n\nOnly a few old scars\ntell the truth—\nand even those\nare hidden.\n\n\nAt night,\nI sit in the dark,\nthe TV too loud,\ntrying to drown out\nthe noise in my head.\n\n\nThe thoughts,\nthe pain,\nthe feeling of not belonging.\n\n\nPart of me wants to give up.\nAnother part\nwon’t let me.\n\n\nBecause I know—\neven when I don’t feel it—\nthere is something in me\nworth staying for.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nNever Enough \n\n\nThat one feeling—\n\n\nthe one that sits\nin my chest\na little too long.\n\n\nThe one that whispers\nno matter what I do,\nit won’t be right.\n\n\nI remember trying—\nreally trying—\nto be what you needed.\n\n\nQuieter.\nBetter.\nEasier to love.\n\n\nBut somehow,\nI was always\ntoo much—\nor not enough at all.\n\n\nAnd I still don’t know\nwhich one hurts more.\n\n\n________________\n\n\nMentally Exhausted\n\n\nI am so mentally exhausted—\nit isn’t even funny anymore.\n\n\nIt feels like I’m trapped\nsomewhere I don’t belong,\nwith no way out,\neven though I’ve done nothing wrong.\n\n\nIt gets worse\nsecond by second.\n\n\nMy grades fall,\nand I try—\nI really try to focus,\nbut my mind won’t stay still.\n\n\nEverything becomes too much\ntoo fast.\n\n\nI feel like I’m failing,\nlike I’m not enough,\nlike I’m somehow stupid—\neven when I know I’m not.\n\n\nI feel invisible.\n\n\nLike my feelings don’t matter,\nlike I don’t matter.\n\n\nAnd I’m sorry—\nfor being\ntoo much\nand not enough\nall at once."}, {"title": "Heart and hurt", "text": "Part II: Heart and hurt\n Fantasy \n\n\nThe fantasy I had\nwas never enough—\n\n\nthe love,\nthe hope,\nthe laughter—\nnever enough\nfor someone like me.\n\n\nSomeone who is only needed\nwhen others want something.\n\n\nSomething I cannot give.\nSomething I do not have.\n\n\nThey say they want me,\nbut what they really want\nis the idea of me—\n\n\nsomeone to listen,\nuntil I need them too.\n\n\nThen they leave.\n\n\nLeave me\nin the dark—\nthe same dark\nthat holds my secrets,\nmy fantasies,\nmy almosts.\n\n\nThe dreams\nthat never became real—\n\n\njust dreams.\n\n\nSweet dreams\nI will never reach.\n\n\n Love/Hate \n\n\nOh, I hate her—\n“Why?” you ask.\n\n\nBecause “her”\nis me.\n\n\nI love her,\nbut I hate her too.\n\n\nThey said she was too much—\ntoo big, too tall,\ntoo wrong.\n\n\nWords I carried\nmy whole life.\n\n\nBut now—\nnow I see her differently.\n\n\nShe survived.\n\n\nThe girl I used to be\ntried to disappear.\n\n\nThe girl I am today\nrefuses to.\n\n\nShe is healing.\nShe is learning.\nShe is still standing.\n\n\nYes, she carries scars—\nbut they are proof\nthat she made it through.\n\n\nAnd now,\nfor the first time,\n\n\nshe sees herself \nas someone worth loving.\n________________\nThe Key You Kept \n\n\nI don’t know why\nyou still have the key\nto my heart—\n\n\na key that never seems\nto leave your hands.\n\n\nI could change the locks,\nbolt every door,\ntell myself\nthis time it’s over.\n\n\nBut I know\nthe moment you knock,\nI’d let you in again.\n\n\nMaybe I’d even\nhand you another key.\n\n\nI don’t know why\nI do this—\nwhy I keep trying,\neven when I know\nhow it ends.\n\n\nI hate you.\n\n\nBut I hate me more\nfor loving you\nthis much.\n\n\nStill—\nI find myself\nat the same door,\nthe same lock,\nthe same mistake…\n\n\ntrying again.\n\n\n\n\n\n\n\n\nIf They Only Knew\n\n\nIf they really looked,\nif they truly paid attention,\nthey would see the signs.\n\n\nThe quiet ones.\nThe hidden ones.\n\n\nThe ones that say\nI’m not okay.\n\n\nI say I want to be alone,\nbut really—\nI just want to be somewhere else.\n\n\nSomewhere peaceful.\nSomewhere happy.\n\n\nBut instead,\nI’m here—\nstuck in the same pain,\nthe same thoughts,\nthe same exhaustion.\n\n\nNo one understands.\nNo one asks.\n\n\nAnd I’m so tired\nof pretending I’m fine.\n\n\nI hate this feeling.\nI hate this place.\n\n\nSome days,\nI just feel done.\n\n\n\n\nHeartache \n\n\nI never want to fall in love again.\n\n\nLove feels like a nightmare\nI keep reliving.\n\n\nEvery time—\nit’s you.\n\n\nNever someone new,\njust the same story\nwith a different hope.\n\n\nI go back\nexpecting change,\nbut nothing ever changes.\n\n\nYou are the same.\nAnd I am still here—\nloving you.\n\n\nWhy choose me\njust to break me again?\n\n\nI was already broken.\n\n\nI’m tired—\ntired of trying,\ntired of loving\nmore than I’m loved.\n\n\nMy mind knows the truth,\nbut my heart refuses to listen.\n\n\nAnd I hate that\nI love you\nthis much.\n\n\n\n\n\n\n Hidden Pain\n\n\nThere’s a kind of pain\nyou can’t always see.\n\n\nThe kind that hides\nbehind smiles,\nbehind laughter,\nbehind “I’m okay.”\n\n\nYou think you know someone—\nuntil you look deeper.\n\n\nPast the surface.\nPast the act.\n\n\nBecause sometimes\nthe ones who seem fine\nare barely holding on.\n\n\nYou’d never know\nunless they break—\nunless they finally show\nwhat’s been building inside.\n\n\nThe thoughts,\nthe stress,\nthe overwhelming weight\nof everything.\n\n\nSo be careful\nwith your words.\n\n\nBecause what feels like a joke to you\nmight be something\nthey’re barely surviving.\n\n\n\n\n\n\n\n\n\n\nTired \nI am so tired—\ntired of things\nthat once meant everything to me.\nTired of caring\nthe way I used to.\nTired of holding on\nwhen letting go\nfeels easier.\nIt’s not just sleep\nthat I’m missing—\nit’s peace.\nThe kind where\nmy mind finally slows down,\nwhere I don’t have to fight\nmy own thoughts\njust to get through the day.\nBecause being this tired\nisn’t just exhausting—\nit’s constant.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Mask I Wore\n\n\nIt’s strange\nhow easy it is\nto look okay.\n\n\nTo smile\nat the right moments,\nto laugh\njust enough\nthat no one asks questions.\n\n\nI got used to it—\nhiding the tired\nin my eyes,\nthe weight\nin my chest,\nthe thoughts\nthat never really stopped.\n\n\nYou saw someone\nwho had it together.\n\n\nI saw someone\nbarely holding on.\n\n\nEvery day\nfelt like a performance—\nlike if I slipped\nfor even a second,\neverything would show.\n\n\nSo I didn’t.\n\n\nI stayed quiet.\nI stayed “fine.”\nI stayed\nexactly\nwhat everyone expected.\n\n\nEven when I wasn’t.\n\n\nEspecially when I wasn’t.\n\n\nBecause it’s easier\nto be seen as strong\nthan it is\nto admit\nyou’re struggling\njust to get through the day.\n\n\nBut what you saw\nwasn’t strength—\n\n\nit was survival."}, {"title": "Numbing and Survival (Coping and escapism)", "text": "Part III: Numbing and Survival (Coping and escapism)\n\n\nNumb on Purpose\n\n\nI don’t do it to have fun.\nI do it because my head won’t shut up.\nBecause every thought is louder than the last,\nand I can’t breathe without feeling like I’m drowning in my own mind.\n\n\nSo I light it, inhale slow, hold it—\nlike maybe this time it’ll fix something.\nAnd for a second, it does.\nEverything goes quiet. Too quiet.\nI don’t feel as much. I don’t think as much.\nI just exist.\nAnd honestly— that’s better than feeling everything all at once.\n\n\nBut then it fades.\nAnd I’m back— same thoughts, same weight, same me.\nOnly now I need it just to feel normal.\nNot high. Just… okay.\nAnd that’s when I realized it wasn’t helping me—\nI was just getting used to not being myself.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nTrying to Stop\n\n\nI told myself I’d quit.\nSaid it like it was easy— like I could just wake up and be different.\nBut it’s not that simple when your mind is the reason you started.\n\n\nBecause now I have to face everything I was running from.\nEvery thought. Every feeling. Every memory I tried to blur out.\nAnd it hits harder without something to soften it.\n\n\nI sit there with nothing but myself—\nand I don’t even know if I like who that is yet.\nBut I’m trying.\nEven when my hands shake and my thoughts get loud again.\nEven when part of me says “just one more time.”\n\n\nI’m trying to stay. To feel it. To face it.\nBecause maybe being broken and real is better than being numb and gone.\nAnd maybe— just maybe— I won’t need it forever.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nStill Here\n\n\nQuitting didn’t make it better.\nThat’s the part no one tells you.\nThe days got harder. The nights got louder.\nThe silence— it screams now.\nEvery thought I used to run from sits with me, front row, waiting.\n\n\nThere’s no pause button anymore.\nNo easy way out.\nJust me and everything I tried to bury.\nMy hands shake sometimes. My chest gets tight.\nAnd those voices— they don’t whisper. They yell.\nTell me to go back, tell me it was easier, tell me I’ll never be enough without it.\n\n\nAnd some days— I almost listen.\nSome days I want to disappear just to feel quiet again.\nBut I don’t. I sit in it. I feel it. I fight it— even when I don’t want to.\n\n\nBecause as hard as this is…\nI’m still here.\nNot numb. Not gone.\nHurting— but real.\nAnd somehow, that has to mean something.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nI Didn’t Say It\n\n\nThere were so many times\nI almost told someone.\n\n\nAlmost said,\n“I’m not okay.”\n\n\nBut the words\nnever made it out.\n\n\nBecause what if\nthey didn’t care?\n\n\nWhat if they listened—\nbut didn’t hear me?\n\n\nSo I swallowed it.\n\n\nLike I always do.\n\n\nAnd now it’s built up\ninto something so heavy\nI don’t even know\nwhere it starts anymore.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nTemporary Quiet\n\n\nI didn’t do it\nto feel something.\n\n\nI did it\nto feel less.\n\n\nLess weight\non my chest.\n\n\nLess thoughts\npressing in\nall at once.\n\n\nFor a moment,\neverything slowed—\n\n\nlike the world\nfinally gave me space\nto breathe.\n\n\nAnd I held onto that\nlonger than I should have.\n\n\nBecause when it left—\n\n\neverything came back\nlouder.\n\n\nLike it was making up\nfor the silence.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nIt Helped… Until It Didn’t \n\n\nAt first,\nit felt like saving me.\n\n\nLike I finally found something\nthat made everything easier.\n\n\nI could laugh again,\nfocus again,\nfeel okay again.\n\n\nBut slowly,\nwithout me noticing—\n\n\nit stopped helping\nand started taking.\n\n\nTaking my focus.\nTaking my energy.\nTaking pieces of me\nI didn’t realize were disappearing.\n\n\nAnd I didn’t know\nwhen that switch happened.\n\n\nI just know\none day I looked at myself—\n\n\nand didn’t feel like me anymore.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Come Down\n\n\nThe worst part\nisn’t the high—\n\n\nit’s after.\n\n\nWhen everything\ncomes rushing back\nall at once.\n\n\nMy chest tight,\nmy head spinning,\nthoughts louder\nthan before.\n\n\nLike I borrowed peace\nI couldn’t afford—\n\n\nand now\nI have to pay it back\nwith interest.\n\n\nNothing feels soft anymore.\n\n\nJust heavier.\nSharper.\nHarder to ignore.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nI Said I’d Stop \n\n\nI’ve said\n“I’m done”\nmore times than I can count.\n\n\nSaid this would be\nthe last time.\n\n\nSaid I didn’t need it anymore.\n\n\nAnd maybe\nI meant it\nevery single time.\n\n\nBut meaning it\nand doing it\nare two different things.\n\n\nBecause when it gets quiet,\nwhen my thoughts get loud again—\n\n\nthose promises\nstart to feel distant.\n\n\nLike something I said\nin a different version of myself.\n\n\nAnd I hate that.\n\n\nI hate how easy it is\nto fall back\ninto something\nI swore I was done with.\n\n\nBut I’m still trying—\n\n\neven if “done”\ndoesn’t stick\nthe first time.\n\n\nCraving Quiet\n\n\nIt’s not even the high\nI miss.\n\n\nIt’s the quiet.\n\n\nThe way my mind\nfinally slows down.\n\n\nThe way everything\nfeels distant\nfor once.\n\n\nBecause being in my head\nall the time—\n\n\nis exhausting.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nDay One Again\n\n\nStarting over\nis the hardest part.\n\n\nAdmitting\nI messed up.\n\n\nAdmitting\nI went back\nto something\nI said I was done with.\n\n\nBut here I am—\n\n\ntrying again.\n\n\nEven if it’s\nday one\nfor the hundredth time."}, {"title": "Reflection and Reality (Facing struggles, honesty with self)", "text": "Part IV: Reflection and Reality (Facing struggles, honesty with self)\nWhat Is Depression \n\n\nWhat is depression?\n\n\nIt is not just a thing—\nnot just a word.\n\n\nIt is a feeling\nyou cannot explain.\n\n\nAn emptiness—\nlike a hollow weeping willow tree,\nstanding\nbut not alive.\n\n\nIt is smiling\nwhile breaking.\n\n\nLaughing\nwhile hurting.\n\n\nIt is loving someone\nbut pushing them away—\nnot because you want to,\nbut because something inside you\nwon’t let you stay.\n\n\nIt is overthinking,\noverfeeling,\noverwhelming\neverything.\n\n\nAnd just when you think\nit’s gone—\n\n\nit waits.\nQuietly,\nin the back of your mind.\n\n\nWhat is depression?\n\n\nIt is something\nyou feel—\nbut cannot escape.\n________________\nNo one tells you\nwhat it’s like\nto grow up too early.\n\n\nThey just call you “strong”\nlike it didn’t cost you anything.\n\n\nI don’t remember being a kid—\nnot really.\n\n\nI remember listening—\nto voices through walls,\nto tension in the air\nthick enough to choke on.\n\n\nI learned how to stay quiet\nbefore I learned how to speak up.\n\n\nBecause sometimes\nsilence was safer.\n\n\nHome wasn’t always a home.\n\n\nIt was unpredictable—\nlike walking on something\nthat could crack\nat any second.\n\n\nAnd when it did,\nyou just stood there\nand took it.\n\n\nThen it was just her—\nmy mom—\ntrying to be everything\nwith almost nothing.\n\n\nTired all the time.\nStressed all the time.\n\n\nAnd I saw it—\neven when she thought I didn’t.\n\n\nWe weren’t rich.\nWe weren’t completely broke.\n\n\nBut I knew what it felt like\nto worry about things\nkids shouldn’t even understand.\n\n\nI wasn’t the only child—\nbut that didn’t make it easier.\n\n\nIf anything,\nit made me feel like\nI had to be less of a problem.\n\n\nSo I became quiet.\nIndependent.\nLow maintenance.\n\n\nNot because I wanted to be—\nbut because I felt like\nI had to be.\n\n\nI learned how to handle things\non my own.\n\n\nHow to cry quietly.\nHow to hurt\nwithout showing it.\n\n\nHow to carry things\nthat were never mine\nto begin with.\n\n\nAnd now—\n\n\npeople wonder\nwhy I am the way I am.\n\n\nWhy I overthink.\nWhy I shut down.\nWhy I feel everything\nso deeply.\n\n\nBut they didn’t see\nthat version of me—\n\n\nthe one who was just a kid\ntrying to survive\nin a place\nthat never really felt safe.\n\n\nAnd maybe\nI made it out—\n\n\nbut some part of me\nnever really left.\n\n\nAnd I’m still learning\nhow to be someone\nwho doesn’t feel like\nthey have to survive\neverything anymore.\n________________\n\n\nWrong Either Way\n\n\nI don’t know how to be right.\n\n\nNo matter what I do,\nit turns into the wrong thing.\n\n\nIf I care too much—\nI’m too much.\n\n\nIf I pull back—\nI don’t care enough.\n\n\nSo I sit there\noverthinking everything\n\n\nuntil I don’t even know\nwhat’s real anymore.\n\n\nI just know\nI’m tired\nof feeling like a problem\nno matter what I do.\n________________\n\n\nWhen It Gets Quiet\n\n\nThe worst part\nis when it gets quiet.\n\n\nThat’s when everything\nI’ve been holding back\ncomes rushing in.\n\n\nThere’s no distractions,\nno noise,\nno one to pretend for.\n\n\nJust me\nand everything\nI’ve been trying not to feel.\n\n\nAnd it doesn’t come gently.\n\n\nIt hits all at once.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nNot Me Anymore\n\n\nI don’t feel like myself anymore.\n\n\nI don’t even know\nwhat that means\nnow.\n\n\nI laugh sometimes,\nI talk,\nI exist—\n\n\nbut it feels fake.\n\n\nLike I’m watching myself\nfrom the outside\n\n\ntrying to act\nlike I’m still the same person.\n\n\nBut I’m not.\n\n\nAnd I don’t know\nwhen that changed.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nToo Heavy to Explain\n\n\nI wish I could explain it.\n\n\nWhy everything feels\nso hard.\n\n\nWhy even the smallest things\nfeel like too much.\n\n\nBut how do you explain\nsomething that doesn’t\neven make sense\nto you?\n\n\nI tried once.\n\n\nTried to put it into words—\nbut they didn’t come out right.\n\n\nIt sounded smaller\nthan it felt.\n\n\nEasier than it is.\n\n\nSo I stopped trying.\n\n\nNow I just say\n“I’m tired”—\n\n\nbecause it’s easier\nthan explaining\neverything behind it.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nAlmost Better\n\n\nI keep thinking\nI’m getting better.\n\n\nLike maybe this time\nit’s real.\n\n\nLike maybe this version of me\nis the one that finally\nfigure it out.\n\n\nBut it never lasts.\n\n\nIt fades.\nIt always fades.\n\n\nAnd I’m left wondering\nif I was ever actually okay—\n\n\nor just distracted\nlong enough\nto believe I was.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nRight There\n\n\nI’ve been breaking\nright in front of people—\n\n\nand nobody noticed.\n\n\nNot the way my voice changes,\nnot the way I go quiet,\nnot the way I stop being me\nwithout saying a word.\n\n\nAnd maybe that’s my fault.\n\n\nMaybe I got too good\nat hiding it.\n\n\nBut still—\n\n\nyou’d think\nsomeone would see it.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nIt Counted to Me\n\n\nI forced myself\nout of bed today.\n\n\nNot because I wanted to—\nbut because staying there\nfelt worse.\n\n\nEverything felt heavy.\nMy body,\nmy thoughts,\neven breathing felt like work.\n\n\nBut I still got up.\n\n\nNo one saw it.\nNo one said anything.\n\n\nBut it counted—\n\n\neven if I’m the only one\nWho knows how hard that was."}, {"title": "Healing and Growth (Hope, learning, resilience)", "text": "Part V: Healing and Growth (Hope, learning, resilience)\nHealing Isn’t Pretty\n\n\nNo one talks about\nhow ugly healing is.\n\n\nHow it doesn’t feel\nlike progress—\n\n\nit feels like breaking\nin a different way.\n\n\nLike facing everything\nyou tried to numb.\n\n\nLike sitting with pain\ninstead of escaping it.\n\n\nHealing isn’t soft.\n\n\nIt’s raw.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nBetter, Not Fixed\n\n\nI’m not okay—\n\n\nbut I’m better\nthan I was.\n\n\nAnd right now,\nthat has to be enough.\n\n\nBecause I’m still learning\nhow to live\nwithout running\nfrom everything I feel.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nRelapse Thoughts\n\n\nSome days\nit still crosses my mind.\n\n\nHow easy it would be\nto go back.\n\n\nTo feel that quiet again.\n\n\nAnd I won’t lie—\nit’s tempting.\n\n\nBut I also remember\nwhat comes after.\n\n\nAnd that’s what\nkeeps me here.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nLearning Myself\n\n\nI’m learning\nhow to sit with myself.\n\n\nWithout distractions.\nWithout numbing.\n\n\nJust me—\n\n\nand everything\nI’ve been avoiding.\n\n\nIt’s uncomfortable.\nIt’s messy.\n\n\nBut it’s real.\n________________\nIn Reality\nIn reality,\nI never needed you—\nI needed me.\nI needed myself mentally,\nneeded to find\nthe pieces I lost,\nneeded to find me—\nmy true identity.\nAnd now,\nI’m feeling great\nin ways\nI never knew how to say.\nIn reality,\nI love this version of me—\nthe version that’s so sweet,\nso real.\nMaybe that’s all I need.\nMaybe I’m not meant\nto be loved,\nbut to give my love—\nto be there when needed,\nto share my pain,\nmy experience.\nI realized\nthe way I loved you\nonly brought me pain.\nSo now—\nI let my phone ring.\nAnd I become\nthe best version of me\nI could ever be—\na version\nyou have yet to see—\nand one\nI’m finally proud to be.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nNot Everyone Leaves\n\n\nI used to think\neveryone would leave\nif they saw the real me.\n\n\nThe messy parts.\nThe broken parts.\n\n\nBut some people stayed.\n\n\nAnd I didn’t know\nwhat to do with that.\n________________\n\n\n\n\nProgress Feels Small\n\n\nNo one claps\nfor the small wins.\n\n\nGetting through the day.\nSaying no.\nTrying again.\n\n\nBut those are the moments\nThat matters the most.\n\n\nEven if no one sees them.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nI Miss Who I Was\n\n\nSometimes\nI miss the old me.\n\n\nThe version of me\nthat didn’t feel this heavy.\n\n\nBut maybe\nI’m not meant\nto go back.\n\n\nMaybe I’m meant\nto become someone\nstronger.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nStill Tempted \n\n\nSome days\nit still crosses my mind.\n\n\nNot loudly—\njust enough\nto be there.\n\n\nA quiet thought:\n“it would be easier.”\n\n\nAnd for a second,\nI almost believe it.\n\n\nI almost miss\nhow simple it felt\nto not feel everything.\n\n\nBut then I remember\nwhat came after.\n\n\nAnd I sit with it—\nthe urge,\nthe memory,\nthe weight—\n\n\nand I let it pass.\n\n\nNot because it’s gone—\n\n\nbut because\nI didn’t follow it.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Truth Is\n\n\nThe truth is—\n\n\nI’m trying.\n\n\nEven when it doesn’t\nlook like it.\n\n\nEven when I mess up.\n\n\nI’m still trying\nto be better\nthan I was yesterday.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nHalfway There\n\n\nI’m not at the bottom anymore—\n\n\nbut I’m not at the top either.\n\n\nI’m somewhere in between.\n\n\nAnd honestly,\nthat’s the hardest place to be.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nChoosing to Stay\n\n\nSome days\nI don’t stay\nbecause I want to.\n\n\nI stay\nbecause I have to.\n\n\nBecause something in me\nisn’t ready\nto give up yet.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Voice Changed\n\n\nThe voice in my head\nused to tear me apart.\n\n\nNow—\n\n\nsometimes,\njust sometimes,\n\n\nit tells me\nto keep going.\n\n\nAnd I hold onto that.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nNot the Same Person\n\n\nI’ve changed.\n\n\nNot all in good ways,\nnot all in bad ways—\n\n\nbut enough\nto know\n\n\nI’m not who I used to be.\n\n\nAnd maybe\nthat’s okay.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nStill trying.\n\n\nAnd I saw it—\neven when she thought I didn’t.\n\n\nWe weren’t rich.\nWe weren’t completely broke.\n\n\nBut I knew what it felt like\nto worry about things\nkids shouldn’t even understand.\n\n\nI wasn’t the only child—\nbut that didn’t make it easier.\n\n\nIf anything,\nit made me feel like\nI had to be less of a problem.\n\n\nSo I became quiet.\nIndependent.\nLow maintenance.\n\n\nNot because I wanted to be—\nbut because I felt like\nI had to be.\n\n\nI learned how to handle things\non my own.\n\n\nHow to cry quietly.\nHow to hurt\nwithout showing it.\n\n\nHow to carry things\nthat were never mine\nto begin with.\n\n\nAnd now—\n\n\npeople wonder\nwhy I am the way I am.\n\n\nWhy I overthink.\nWhy I shut down.\nWhy I feel everything\nso deeply.\n\n\nBut they didn’t see\nthat version of me—\n\n\nthe one who was just a kid\ntrying to survive\nin a place\nthat never really felt safe.\n\n\nAnd maybe\nI made it out—\n\n\nbut some part of me\nnever really left.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nStill Here\n\n\nI thought healing\nwould feel like relief—\n\n\nlike waking up one day\nand finally\nbeing okay.\n\n\nBut it didn’t.\n\n\nIt felt like this—\n\n\nlike sitting in silence\nthat screams louder\nthan the noise ever did.\n\n\nLike facing thoughts\nI spent so long\ntrying to outrun.\n\n\nLike learning\nhow to exist\nwithout an escape.\n\n\nThere are days\nI still want to disappear—\n\n\nnot in a dramatic way,\nnot in a loud way—\n\n\njust enough\nto make everything\nstop for a second.\n\n\nJust enough\nto breathe\nwithout overthinking it.\n\n\nAnd some days,\nI almost give in.\n\n\nAlmost go back\nto what made it easier.\n\n\nAlmost choose\nquiet\nover real.\n\n\nBut I don’t.\n\n\nI stay.\n\n\nEven when my chest feels heavy.\nEven when my thoughts won’t stop.\nEven when I don’t recognize\nthe person I’ve become.\n\n\nI stay.\n\n\nNot because I’m strong.\n\n\nNot because I have it all figured out.\n\n\nBut because something in me—\nsomething small,\nsomething quiet—\n\n\nrefuses to leave.\n\n\nAnd maybe\nthat’s what healing is.\n\n\nNot fixing everything.\nNot becoming perfect.\n\n\nJust choosing,\nover and over again—\n\n\nto stay.\n\n\nAnd somehow—\n\n\nI still am.\n________________\nStill Becoming\n\n\nI’m not who I was.\n\n\nAnd I’m not\nwho I thought\nI’d be by now.\n\n\nSome days\nI still feel lost.\n\n\nSome days\neverything in me\nfeels heavy again—\n\n\nlike I’m right back\nwhere I started.\n\n\nBut I’m not.\n\n\nBecause I don’t give up\nthe way I used to.\n\n\nI don’t disappear\nthe way I almost did.\n\n\nI stay.\n\n\nEven when it’s hard.\nEven when I don’t want to.\nEven when nothing feels\nlike it’s getting better.\n\n\nI stay.\n\n\nAnd maybe\nthat’s enough\nfor right now.\n\n\nMaybe healing\nisn’t about\nhaving it all figured out—\n\n\nmaybe it’s just\nlearning how to keep going\nwithout losing yourself\nevery time it hurts.\n\n\nI’m still learning.\n\n\nStill growing.\n\n\nStill trying.\n\n\nAnd even if I’m not there yet—\n\n\nI’m not where I used to be.\n\n\nAnd for the first time,\n\n\nthat feels like\nsomething worth holding onto.\n________________\nAnd even on the days I feel broken, I keep going, because I know I’m still becoming who I’m meant to be.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nAbout the Author\n\n\nJacklynne Reenee Coles is a 17-year-old writer who uses poetry to say the things she can’t always say out loud.\n\n\nHer work comes from real experiences—moments of pain, overthinking, feeling like too much and not enough at the same time, and trying to figure out how to keep going through all of it.\n\n\nShe started writing as a way to cope, to understand her own thoughts, and to put feelings somewhere instead of holding them in. Over time, it became more than that. It became a way to be honest—with herself and with others.\n\n\nHer poems aren’t meant to be perfect. They’re meant to be real.\n\n\nShe writes for anyone who feels unheard, overwhelmed, or stuck in their own head. For anyone who is trying to heal, even when it doesn’t look like it.\n\n\nThis book is a collection of those moments—unfiltered, messy, and true.\n\n\nAnd if even one person reads it and feels less alone,\nthen it meant something.\n________________\nIt's just so silly, you know how you see me, so incompetent and silly somebody who i once was so dearly, who i no longer know so truly, ive changed and yea thats great, that im not the same me that i always hated but somebody new and improved somebody worth everything and much more who would i be without the incomplete i look at myself who im still slowly finding so a sound little by little bit by bit im really starting to love it and yes i mean me even if i am still overly silly a little too much quite a bit youll never truly know me nor my true intentions probably wont ever fully show but i love me truly"}], "full": "﻿Author's note: This collection is not just poetry—it is pieces \nEach poem holds a moment I didn’t know how to say out loud, thoughts I tried to hide, and feelings that felt too heavy to carry alone. Some of these pages were written in pain, some in reflection, and some in the quiet moments in between where I was just trying to understand myself.\n\n\nThis book is for anyone who has ever felt like they were too much and not enough at the same time. For anyone who smiles on the outside but feels something completely different within. For anyone who is still learning how to heal.\n\n\nI am not perfect, and these poems are not meant to be. They are real. They are honest. They are mine.\n\n\nAnd maybe, in some way, they will feel like yours too.\n________________\n\n\nPart I: The wake up\n Rose \n\n\nLife is like a rose—\nbeautiful, soft, and sweet,\nyet painful all at once.\n\n\nThere is much to gain,\nthough sometimes\nthou mayst fall.\n\n\nStill, thou must rise again,\nand shine—\nbecoming the rose\nthou wert meant to be.\n\n\nThou may feel alone,\nbut remember—\nthere is more around thee\nthan thou can see.\n\n\nEven in darkness,\nthou shalt bloom.\nThough thorns may prick and wound,\nthou shalt not give up.\n\n\nFor even in sorrow,\nthou remainest\nbeautiful and sweet.\n\n\n________________\n\n\nLoud Silence\n\n\nI hate it.\nI hate me—\nwho I am,\nwho I was.\n\n\nI hate how I fail\nbefore I even begin.\n\n\nI’m going through so much,\nyet no one sees—\nno one understands\nhow loud it gets inside my head.\n\n\nI try to focus,\nbut my thoughts\npull me under—\nreminding me\nof everything I’ve done wrong.\n\n\nI call myself\na failure,\na mistake,\na person who can’t get it right.\n\n\nBut I’m trying.\nIsn’t that something?\n\n\nI am human—\nflawed, imperfect,\nstill learning.\n\n\nEven if it doesn’t feel like enough,\nit is the truth:\nI am still here,\nstill trying\nto become better.\n\n\n\n\n\n\nToo Loud Inside\n\n\nIt’s too loud in my head\nfor someone who says nothing.\n\n\nNot just noise—\nbut echoes.\n\n\nEvery mistake\nreplaying\nlike it just happened.\n\n\nEvery word\nI wish I could take back\nfinding its way\nto the front again.\n\n\nIt feels like\nbeing trapped in a room\nwhere the walls\nwon’t stop talking.\n\n\nAnd no matter\nhow quiet I sit—\n\n\nit never quiets back.\n\n\n________________\n\n\nTwo Versions of Me\n\n\nMentally, I am gone—\nburnt out,\nburied deep\nin a dark place\nno one can see.\n\n\nCrying,\nbreaking,\nnever quite the same.\n\n\nBut physically—\nI’m here.\n\n\nSmiling,\nlaughing,\nlooking like\nnothing is wrong.\n\n\nOnly a few old scars\ntell the truth—\nand even those\nare hidden.\n\n\nAt night,\nI sit in the dark,\nthe TV too loud,\ntrying to drown out\nthe noise in my head.\n\n\nThe thoughts,\nthe pain,\nthe feeling of not belonging.\n\n\nPart of me wants to give up.\nAnother part\nwon’t let me.\n\n\nBecause I know—\neven when I don’t feel it—\nthere is something in me\nworth staying for.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nNever Enough \n\n\nThat one feeling—\n\n\nthe one that sits\nin my chest\na little too long.\n\n\nThe one that whispers\nno matter what I do,\nit won’t be right.\n\n\nI remember trying—\nreally trying—\nto be what you needed.\n\n\nQuieter.\nBetter.\nEasier to love.\n\n\nBut somehow,\nI was always\ntoo much—\nor not enough at all.\n\n\nAnd I still don’t know\nwhich one hurts more.\n\n\n________________\n\n\nMentally Exhausted\n\n\nI am so mentally exhausted—\nit isn’t even funny anymore.\n\n\nIt feels like I’m trapped\nsomewhere I don’t belong,\nwith no way out,\neven though I’ve done nothing wrong.\n\n\nIt gets worse\nsecond by second.\n\n\nMy grades fall,\nand I try—\nI really try to focus,\nbut my mind won’t stay still.\n\n\nEverything becomes too much\ntoo fast.\n\n\nI feel like I’m failing,\nlike I’m not enough,\nlike I’m somehow stupid—\neven when I know I’m not.\n\n\nI feel invisible.\n\n\nLike my feelings don’t matter,\nlike I don’t matter.\n\n\nAnd I’m sorry—\nfor being\ntoo much\nand not enough\nall at once.\nPart II: Heart and hurt\n Fantasy \n\n\nThe fantasy I had\nwas never enough—\n\n\nthe love,\nthe hope,\nthe laughter—\nnever enough\nfor someone like me.\n\n\nSomeone who is only needed\nwhen others want something.\n\n\nSomething I cannot give.\nSomething I do not have.\n\n\nThey say they want me,\nbut what they really want\nis the idea of me—\n\n\nsomeone to listen,\nuntil I need them too.\n\n\nThen they leave.\n\n\nLeave me\nin the dark—\nthe same dark\nthat holds my secrets,\nmy fantasies,\nmy almosts.\n\n\nThe dreams\nthat never became real—\n\n\njust dreams.\n\n\nSweet dreams\nI will never reach.\n\n\n Love/Hate \n\n\nOh, I hate her—\n“Why?” you ask.\n\n\nBecause “her”\nis me.\n\n\nI love her,\nbut I hate her too.\n\n\nThey said she was too much—\ntoo big, too tall,\ntoo wrong.\n\n\nWords I carried\nmy whole life.\n\n\nBut now—\nnow I see her differently.\n\n\nShe survived.\n\n\nThe girl I used to be\ntried to disappear.\n\n\nThe girl I am today\nrefuses to.\n\n\nShe is healing.\nShe is learning.\nShe is still standing.\n\n\nYes, she carries scars—\nbut they are proof\nthat she made it through.\n\n\nAnd now,\nfor the first time,\n\n\nshe sees herself \nas someone worth loving.\n________________\nThe Key You Kept \n\n\nI don’t know why\nyou still have the key\nto my heart—\n\n\na key that never seems\nto leave your hands.\n\n\nI could change the locks,\nbolt every door,\ntell myself\nthis time it’s over.\n\n\nBut I know\nthe moment you knock,\nI’d let you in again.\n\n\nMaybe I’d even\nhand you another key.\n\n\nI don’t know why\nI do this—\nwhy I keep trying,\neven when I know\nhow it ends.\n\n\nI hate you.\n\n\nBut I hate me more\nfor loving you\nthis much.\n\n\nStill—\nI find myself\nat the same door,\nthe same lock,\nthe same mistake…\n\n\ntrying again.\n\n\n\n\n\n\n\n\nIf They Only Knew\n\n\nIf they really looked,\nif they truly paid attention,\nthey would see the signs.\n\n\nThe quiet ones.\nThe hidden ones.\n\n\nThe ones that say\nI’m not okay.\n\n\nI say I want to be alone,\nbut really—\nI just want to be somewhere else.\n\n\nSomewhere peaceful.\nSomewhere happy.\n\n\nBut instead,\nI’m here—\nstuck in the same pain,\nthe same thoughts,\nthe same exhaustion.\n\n\nNo one understands.\nNo one asks.\n\n\nAnd I’m so tired\nof pretending I’m fine.\n\n\nI hate this feeling.\nI hate this place.\n\n\nSome days,\nI just feel done.\n\n\n\n\nHeartache \n\n\nI never want to fall in love again.\n\n\nLove feels like a nightmare\nI keep reliving.\n\n\nEvery time—\nit’s you.\n\n\nNever someone new,\njust the same story\nwith a different hope.\n\n\nI go back\nexpecting change,\nbut nothing ever changes.\n\n\nYou are the same.\nAnd I am still here—\nloving you.\n\n\nWhy choose me\njust to break me again?\n\n\nI was already broken.\n\n\nI’m tired—\ntired of trying,\ntired of loving\nmore than I’m loved.\n\n\nMy mind knows the truth,\nbut my heart refuses to listen.\n\n\nAnd I hate that\nI love you\nthis much.\n\n\n\n\n\n\n Hidden Pain\n\n\nThere’s a kind of pain\nyou can’t always see.\n\n\nThe kind that hides\nbehind smiles,\nbehind laughter,\nbehind “I’m okay.”\n\n\nYou think you know someone—\nuntil you look deeper.\n\n\nPast the surface.\nPast the act.\n\n\nBecause sometimes\nthe ones who seem fine\nare barely holding on.\n\n\nYou’d never know\nunless they break—\nunless they finally show\nwhat’s been building inside.\n\n\nThe thoughts,\nthe stress,\nthe overwhelming weight\nof everything.\n\n\nSo be careful\nwith your words.\n\n\nBecause what feels like a joke to you\nmight be something\nthey’re barely surviving.\n\n\n\n\n\n\n\n\n\n\nTired \nI am so tired—\ntired of things\nthat once meant everything to me.\nTired of caring\nthe way I used to.\nTired of holding on\nwhen letting go\nfeels easier.\nIt’s not just sleep\nthat I’m missing—\nit’s peace.\nThe kind where\nmy mind finally slows down,\nwhere I don’t have to fight\nmy own thoughts\njust to get through the day.\nBecause being this tired\nisn’t just exhausting—\nit’s constant.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Mask I Wore\n\n\nIt’s strange\nhow easy it is\nto look okay.\n\n\nTo smile\nat the right moments,\nto laugh\njust enough\nthat no one asks questions.\n\n\nI got used to it—\nhiding the tired\nin my eyes,\nthe weight\nin my chest,\nthe thoughts\nthat never really stopped.\n\n\nYou saw someone\nwho had it together.\n\n\nI saw someone\nbarely holding on.\n\n\nEvery day\nfelt like a performance—\nlike if I slipped\nfor even a second,\neverything would show.\n\n\nSo I didn’t.\n\n\nI stayed quiet.\nI stayed “fine.”\nI stayed\nexactly\nwhat everyone expected.\n\n\nEven when I wasn’t.\n\n\nEspecially when I wasn’t.\n\n\nBecause it’s easier\nto be seen as strong\nthan it is\nto admit\nyou’re struggling\njust to get through the day.\n\n\nBut what you saw\nwasn’t strength—\n\n\nit was survival.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nPart III: Numbing and Survival (Coping and escapism)\n\n\nNumb on Purpose\n\n\nI don’t do it to have fun.\nI do it because my head won’t shut up.\nBecause every thought is louder than the last,\nand I can’t breathe without feeling like I’m drowning in my own mind.\n\n\nSo I light it, inhale slow, hold it—\nlike maybe this time it’ll fix something.\nAnd for a second, it does.\nEverything goes quiet. Too quiet.\nI don’t feel as much. I don’t think as much.\nI just exist.\nAnd honestly— that’s better than feeling everything all at once.\n\n\nBut then it fades.\nAnd I’m back— same thoughts, same weight, same me.\nOnly now I need it just to feel normal.\nNot high. Just… okay.\nAnd that’s when I realized it wasn’t helping me—\nI was just getting used to not being myself.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nTrying to Stop\n\n\nI told myself I’d quit.\nSaid it like it was easy— like I could just wake up and be different.\nBut it’s not that simple when your mind is the reason you started.\n\n\nBecause now I have to face everything I was running from.\nEvery thought. Every feeling. Every memory I tried to blur out.\nAnd it hits harder without something to soften it.\n\n\nI sit there with nothing but myself—\nand I don’t even know if I like who that is yet.\nBut I’m trying.\nEven when my hands shake and my thoughts get loud again.\nEven when part of me says “just one more time.”\n\n\nI’m trying to stay. To feel it. To face it.\nBecause maybe being broken and real is better than being numb and gone.\nAnd maybe— just maybe— I won’t need it forever.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nStill Here\n\n\nQuitting didn’t make it better.\nThat’s the part no one tells you.\nThe days got harder. The nights got louder.\nThe silence— it screams now.\nEvery thought I used to run from sits with me, front row, waiting.\n\n\nThere’s no pause button anymore.\nNo easy way out.\nJust me and everything I tried to bury.\nMy hands shake sometimes. My chest gets tight.\nAnd those voices— they don’t whisper. They yell.\nTell me to go back, tell me it was easier, tell me I’ll never be enough without it.\n\n\nAnd some days— I almost listen.\nSome days I want to disappear just to feel quiet again.\nBut I don’t. I sit in it. I feel it. I fight it— even when I don’t want to.\n\n\nBecause as hard as this is…\nI’m still here.\nNot numb. Not gone.\nHurting— but real.\nAnd somehow, that has to mean something.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nI Didn’t Say It\n\n\nThere were so many times\nI almost told someone.\n\n\nAlmost said,\n“I’m not okay.”\n\n\nBut the words\nnever made it out.\n\n\nBecause what if\nthey didn’t care?\n\n\nWhat if they listened—\nbut didn’t hear me?\n\n\nSo I swallowed it.\n\n\nLike I always do.\n\n\nAnd now it’s built up\ninto something so heavy\nI don’t even know\nwhere it starts anymore.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nTemporary Quiet\n\n\nI didn’t do it\nto feel something.\n\n\nI did it\nto feel less.\n\n\nLess weight\non my chest.\n\n\nLess thoughts\npressing in\nall at once.\n\n\nFor a moment,\neverything slowed—\n\n\nlike the world\nfinally gave me space\nto breathe.\n\n\nAnd I held onto that\nlonger than I should have.\n\n\nBecause when it left—\n\n\neverything came back\nlouder.\n\n\nLike it was making up\nfor the silence.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nIt Helped… Until It Didn’t \n\n\nAt first,\nit felt like saving me.\n\n\nLike I finally found something\nthat made everything easier.\n\n\nI could laugh again,\nfocus again,\nfeel okay again.\n\n\nBut slowly,\nwithout me noticing—\n\n\nit stopped helping\nand started taking.\n\n\nTaking my focus.\nTaking my energy.\nTaking pieces of me\nI didn’t realize were disappearing.\n\n\nAnd I didn’t know\nwhen that switch happened.\n\n\nI just know\none day I looked at myself—\n\n\nand didn’t feel like me anymore.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Come Down\n\n\nThe worst part\nisn’t the high—\n\n\nit’s after.\n\n\nWhen everything\ncomes rushing back\nall at once.\n\n\nMy chest tight,\nmy head spinning,\nthoughts louder\nthan before.\n\n\nLike I borrowed peace\nI couldn’t afford—\n\n\nand now\nI have to pay it back\nwith interest.\n\n\nNothing feels soft anymore.\n\n\nJust heavier.\nSharper.\nHarder to ignore.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nI Said I’d Stop \n\n\nI’ve said\n“I’m done”\nmore times than I can count.\n\n\nSaid this would be\nthe last time.\n\n\nSaid I didn’t need it anymore.\n\n\nAnd maybe\nI meant it\nevery single time.\n\n\nBut meaning it\nand doing it\nare two different things.\n\n\nBecause when it gets quiet,\nwhen my thoughts get loud again—\n\n\nthose promises\nstart to feel distant.\n\n\nLike something I said\nin a different version of myself.\n\n\nAnd I hate that.\n\n\nI hate how easy it is\nto fall back\ninto something\nI swore I was done with.\n\n\nBut I’m still trying—\n\n\neven if “done”\ndoesn’t stick\nthe first time.\n\n\nCraving Quiet\n\n\nIt’s not even the high\nI miss.\n\n\nIt’s the quiet.\n\n\nThe way my mind\nfinally slows down.\n\n\nThe way everything\nfeels distant\nfor once.\n\n\nBecause being in my head\nall the time—\n\n\nis exhausting.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nDay One Again\n\n\nStarting over\nis the hardest part.\n\n\nAdmitting\nI messed up.\n\n\nAdmitting\nI went back\nto something\nI said I was done with.\n\n\nBut here I am—\n\n\ntrying again.\n\n\nEven if it’s\nday one\nfor the hundredth time.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nPart IV: Reflection and Reality (Facing struggles, honesty with self)\nWhat Is Depression \n\n\nWhat is depression?\n\n\nIt is not just a thing—\nnot just a word.\n\n\nIt is a feeling\nyou cannot explain.\n\n\nAn emptiness—\nlike a hollow weeping willow tree,\nstanding\nbut not alive.\n\n\nIt is smiling\nwhile breaking.\n\n\nLaughing\nwhile hurting.\n\n\nIt is loving someone\nbut pushing them away—\nnot because you want to,\nbut because something inside you\nwon’t let you stay.\n\n\nIt is overthinking,\noverfeeling,\noverwhelming\neverything.\n\n\nAnd just when you think\nit’s gone—\n\n\nit waits.\nQuietly,\nin the back of your mind.\n\n\nWhat is depression?\n\n\nIt is something\nyou feel—\nbut cannot escape.\n________________\nNo one tells you\nwhat it’s like\nto grow up too early.\n\n\nThey just call you “strong”\nlike it didn’t cost you anything.\n\n\nI don’t remember being a kid—\nnot really.\n\n\nI remember listening—\nto voices through walls,\nto tension in the air\nthick enough to choke on.\n\n\nI learned how to stay quiet\nbefore I learned how to speak up.\n\n\nBecause sometimes\nsilence was safer.\n\n\nHome wasn’t always a home.\n\n\nIt was unpredictable—\nlike walking on something\nthat could crack\nat any second.\n\n\nAnd when it did,\nyou just stood there\nand took it.\n\n\nThen it was just her—\nmy mom—\ntrying to be everything\nwith almost nothing.\n\n\nTired all the time.\nStressed all the time.\n\n\nAnd I saw it—\neven when she thought I didn’t.\n\n\nWe weren’t rich.\nWe weren’t completely broke.\n\n\nBut I knew what it felt like\nto worry about things\nkids shouldn’t even understand.\n\n\nI wasn’t the only child—\nbut that didn’t make it easier.\n\n\nIf anything,\nit made me feel like\nI had to be less of a problem.\n\n\nSo I became quiet.\nIndependent.\nLow maintenance.\n\n\nNot because I wanted to be—\nbut because I felt like\nI had to be.\n\n\nI learned how to handle things\non my own.\n\n\nHow to cry quietly.\nHow to hurt\nwithout showing it.\n\n\nHow to carry things\nthat were never mine\nto begin with.\n\n\nAnd now—\n\n\npeople wonder\nwhy I am the way I am.\n\n\nWhy I overthink.\nWhy I shut down.\nWhy I feel everything\nso deeply.\n\n\nBut they didn’t see\nthat version of me—\n\n\nthe one who was just a kid\ntrying to survive\nin a place\nthat never really felt safe.\n\n\nAnd maybe\nI made it out—\n\n\nbut some part of me\nnever really left.\n\n\nAnd I’m still learning\nhow to be someone\nwho doesn’t feel like\nthey have to survive\neverything anymore.\n________________\n\n\nWrong Either Way\n\n\nI don’t know how to be right.\n\n\nNo matter what I do,\nit turns into the wrong thing.\n\n\nIf I care too much—\nI’m too much.\n\n\nIf I pull back—\nI don’t care enough.\n\n\nSo I sit there\noverthinking everything\n\n\nuntil I don’t even know\nwhat’s real anymore.\n\n\nI just know\nI’m tired\nof feeling like a problem\nno matter what I do.\n________________\n\n\nWhen It Gets Quiet\n\n\nThe worst part\nis when it gets quiet.\n\n\nThat’s when everything\nI’ve been holding back\ncomes rushing in.\n\n\nThere’s no distractions,\nno noise,\nno one to pretend for.\n\n\nJust me\nand everything\nI’ve been trying not to feel.\n\n\nAnd it doesn’t come gently.\n\n\nIt hits all at once.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nNot Me Anymore\n\n\nI don’t feel like myself anymore.\n\n\nI don’t even know\nwhat that means\nnow.\n\n\nI laugh sometimes,\nI talk,\nI exist—\n\n\nbut it feels fake.\n\n\nLike I’m watching myself\nfrom the outside\n\n\ntrying to act\nlike I’m still the same person.\n\n\nBut I’m not.\n\n\nAnd I don’t know\nwhen that changed.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nToo Heavy to Explain\n\n\nI wish I could explain it.\n\n\nWhy everything feels\nso hard.\n\n\nWhy even the smallest things\nfeel like too much.\n\n\nBut how do you explain\nsomething that doesn’t\neven make sense\nto you?\n\n\nI tried once.\n\n\nTried to put it into words—\nbut they didn’t come out right.\n\n\nIt sounded smaller\nthan it felt.\n\n\nEasier than it is.\n\n\nSo I stopped trying.\n\n\nNow I just say\n“I’m tired”—\n\n\nbecause it’s easier\nthan explaining\neverything behind it.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nAlmost Better\n\n\nI keep thinking\nI’m getting better.\n\n\nLike maybe this time\nit’s real.\n\n\nLike maybe this version of me\nis the one that finally\nfigure it out.\n\n\nBut it never lasts.\n\n\nIt fades.\nIt always fades.\n\n\nAnd I’m left wondering\nif I was ever actually okay—\n\n\nor just distracted\nlong enough\nto believe I was.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nRight There\n\n\nI’ve been breaking\nright in front of people—\n\n\nand nobody noticed.\n\n\nNot the way my voice changes,\nnot the way I go quiet,\nnot the way I stop being me\nwithout saying a word.\n\n\nAnd maybe that’s my fault.\n\n\nMaybe I got too good\nat hiding it.\n\n\nBut still—\n\n\nyou’d think\nsomeone would see it.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nIt Counted to Me\n\n\nI forced myself\nout of bed today.\n\n\nNot because I wanted to—\nbut because staying there\nfelt worse.\n\n\nEverything felt heavy.\nMy body,\nmy thoughts,\neven breathing felt like work.\n\n\nBut I still got up.\n\n\nNo one saw it.\nNo one said anything.\n\n\nBut it counted—\n\n\neven if I’m the only one\nWho knows how hard that was.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nPart V: Healing and Growth (Hope, learning, resilience)\nHealing Isn’t Pretty\n\n\nNo one talks about\nhow ugly healing is.\n\n\nHow it doesn’t feel\nlike progress—\n\n\nit feels like breaking\nin a different way.\n\n\nLike facing everything\nyou tried to numb.\n\n\nLike sitting with pain\ninstead of escaping it.\n\n\nHealing isn’t soft.\n\n\nIt’s raw.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nBetter, Not Fixed\n\n\nI’m not okay—\n\n\nbut I’m better\nthan I was.\n\n\nAnd right now,\nthat has to be enough.\n\n\nBecause I’m still learning\nhow to live\nwithout running\nfrom everything I feel.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nRelapse Thoughts\n\n\nSome days\nit still crosses my mind.\n\n\nHow easy it would be\nto go back.\n\n\nTo feel that quiet again.\n\n\nAnd I won’t lie—\nit’s tempting.\n\n\nBut I also remember\nwhat comes after.\n\n\nAnd that’s what\nkeeps me here.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nLearning Myself\n\n\nI’m learning\nhow to sit with myself.\n\n\nWithout distractions.\nWithout numbing.\n\n\nJust me—\n\n\nand everything\nI’ve been avoiding.\n\n\nIt’s uncomfortable.\nIt’s messy.\n\n\nBut it’s real.\n________________\nIn Reality\nIn reality,\nI never needed you—\nI needed me.\nI needed myself mentally,\nneeded to find\nthe pieces I lost,\nneeded to find me—\nmy true identity.\nAnd now,\nI’m feeling great\nin ways\nI never knew how to say.\nIn reality,\nI love this version of me—\nthe version that’s so sweet,\nso real.\nMaybe that’s all I need.\nMaybe I’m not meant\nto be loved,\nbut to give my love—\nto be there when needed,\nto share my pain,\nmy experience.\nI realized\nthe way I loved you\nonly brought me pain.\nSo now—\nI let my phone ring.\nAnd I become\nthe best version of me\nI could ever be—\na version\nyou have yet to see—\nand one\nI’m finally proud to be.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nNot Everyone Leaves\n\n\nI used to think\neveryone would leave\nif they saw the real me.\n\n\nThe messy parts.\nThe broken parts.\n\n\nBut some people stayed.\n\n\nAnd I didn’t know\nwhat to do with that.\n________________\n\n\n\n\nProgress Feels Small\n\n\nNo one claps\nfor the small wins.\n\n\nGetting through the day.\nSaying no.\nTrying again.\n\n\nBut those are the moments\nThat matters the most.\n\n\nEven if no one sees them.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nI Miss Who I Was\n\n\nSometimes\nI miss the old me.\n\n\nThe version of me\nthat didn’t feel this heavy.\n\n\nBut maybe\nI’m not meant\nto go back.\n\n\nMaybe I’m meant\nto become someone\nstronger.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nStill Tempted \n\n\nSome days\nit still crosses my mind.\n\n\nNot loudly—\njust enough\nto be there.\n\n\nA quiet thought:\n“it would be easier.”\n\n\nAnd for a second,\nI almost believe it.\n\n\nI almost miss\nhow simple it felt\nto not feel everything.\n\n\nBut then I remember\nwhat came after.\n\n\nAnd I sit with it—\nthe urge,\nthe memory,\nthe weight—\n\n\nand I let it pass.\n\n\nNot because it’s gone—\n\n\nbut because\nI didn’t follow it.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Truth Is\n\n\nThe truth is—\n\n\nI’m trying.\n\n\nEven when it doesn’t\nlook like it.\n\n\nEven when I mess up.\n\n\nI’m still trying\nto be better\nthan I was yesterday.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nHalfway There\n\n\nI’m not at the bottom anymore—\n\n\nbut I’m not at the top either.\n\n\nI’m somewhere in between.\n\n\nAnd honestly,\nthat’s the hardest place to be.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nChoosing to Stay\n\n\nSome days\nI don’t stay\nbecause I want to.\n\n\nI stay\nbecause I have to.\n\n\nBecause something in me\nisn’t ready\nto give up yet.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Voice Changed\n\n\nThe voice in my head\nused to tear me apart.\n\n\nNow—\n\n\nsometimes,\njust sometimes,\n\n\nit tells me\nto keep going.\n\n\nAnd I hold onto that.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nNot the Same Person\n\n\nI’ve changed.\n\n\nNot all in good ways,\nnot all in bad ways—\n\n\nbut enough\nto know\n\n\nI’m not who I used to be.\n\n\nAnd maybe\nthat’s okay.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nStill trying.\n\n\nAnd I saw it—\neven when she thought I didn’t.\n\n\nWe weren’t rich.\nWe weren’t completely broke.\n\n\nBut I knew what it felt like\nto worry about things\nkids shouldn’t even understand.\n\n\nI wasn’t the only child—\nbut that didn’t make it easier.\n\n\nIf anything,\nit made me feel like\nI had to be less of a problem.\n\n\nSo I became quiet.\nIndependent.\nLow maintenance.\n\n\nNot because I wanted to be—\nbut because I felt like\nI had to be.\n\n\nI learned how to handle things\non my own.\n\n\nHow to cry quietly.\nHow to hurt\nwithout showing it.\n\n\nHow to carry things\nthat were never mine\nto begin with.\n\n\nAnd now—\n\n\npeople wonder\nwhy I am the way I am.\n\n\nWhy I overthink.\nWhy I shut down.\nWhy I feel everything\nso deeply.\n\n\nBut they didn’t see\nthat version of me—\n\n\nthe one who was just a kid\ntrying to survive\nin a place\nthat never really felt safe.\n\n\nAnd maybe\nI made it out—\n\n\nbut some part of me\nnever really left.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nStill Here\n\n\nI thought healing\nwould feel like relief—\n\n\nlike waking up one day\nand finally\nbeing okay.\n\n\nBut it didn’t.\n\n\nIt felt like this—\n\n\nlike sitting in silence\nthat screams louder\nthan the noise ever did.\n\n\nLike facing thoughts\nI spent so long\ntrying to outrun.\n\n\nLike learning\nhow to exist\nwithout an escape.\n\n\nThere are days\nI still want to disappear—\n\n\nnot in a dramatic way,\nnot in a loud way—\n\n\njust enough\nto make everything\nstop for a second.\n\n\nJust enough\nto breathe\nwithout overthinking it.\n\n\nAnd some days,\nI almost give in.\n\n\nAlmost go back\nto what made it easier.\n\n\nAlmost choose\nquiet\nover real.\n\n\nBut I don’t.\n\n\nI stay.\n\n\nEven when my chest feels heavy.\nEven when my thoughts won’t stop.\nEven when I don’t recognize\nthe person I’ve become.\n\n\nI stay.\n\n\nNot because I’m strong.\n\n\nNot because I have it all figured out.\n\n\nBut because something in me—\nsomething small,\nsomething quiet—\n\n\nrefuses to leave.\n\n\nAnd maybe\nthat’s what healing is.\n\n\nNot fixing everything.\nNot becoming perfect.\n\n\nJust choosing,\nover and over again—\n\n\nto stay.\n\n\nAnd somehow—\n\n\nI still am.\n________________\nStill Becoming\n\n\nI’m not who I was.\n\n\nAnd I’m not\nwho I thought\nI’d be by now.\n\n\nSome days\nI still feel lost.\n\n\nSome days\neverything in me\nfeels heavy again—\n\n\nlike I’m right back\nwhere I started.\n\n\nBut I’m not.\n\n\nBecause I don’t give up\nthe way I used to.\n\n\nI don’t disappear\nthe way I almost did.\n\n\nI stay.\n\n\nEven when it’s hard.\nEven when I don’t want to.\nEven when nothing feels\nlike it’s getting better.\n\n\nI stay.\n\n\nAnd maybe\nthat’s enough\nfor right now.\n\n\nMaybe healing\nisn’t about\nhaving it all figured out—\n\n\nmaybe it’s just\nlearning how to keep going\nwithout losing yourself\nevery time it hurts.\n\n\nI’m still learning.\n\n\nStill growing.\n\n\nStill trying.\n\n\nAnd even if I’m not there yet—\n\n\nI’m not where I used to be.\n\n\nAnd for the first time,\n\n\nthat feels like\nsomething worth holding onto.\n________________\nAnd even on the days I feel broken, I keep going, because I know I’m still becoming who I’m meant to be.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nAbout the Author\n\n\nJacklynne Reenee Coles is a 17-year-old writer who uses poetry to say the things she can’t always say out loud.\n\n\nHer work comes from real experiences—moments of pain, overthinking, feeling like too much and not enough at the same time, and trying to figure out how to keep going through all of it.\n\n\nShe started writing as a way to cope, to understand her own thoughts, and to put feelings somewhere instead of holding them in. Over time, it became more than that. It became a way to be honest—with herself and with others.\n\n\nHer poems aren’t meant to be perfect. They’re meant to be real.\n\n\nShe writes for anyone who feels unheard, overwhelmed, or stuck in their own head. For anyone who is trying to heal, even when it doesn’t look like it.\n\n\nThis book is a collection of those moments—unfiltered, messy, and true.\n\n\nAnd if even one person reads it and feels less alone,\nthen it meant something.\n________________\nIt's just so silly, you know how you see me, so incompetent and silly somebody who i once was so dearly, who i no longer know so truly, ive changed and yea thats great, that im not the same me that i always hated but somebody new and improved somebody worth everything and much more who would i be without the incomplete i look at myself who im still slowly finding so a sound little by little bit by bit im really starting to love it and yes i mean me even if i am still overly silly a little too much quite a bit youll never truly know me nor my true intentions probably wont ever fully show but i love me truly"};

if(view==='write')app.innerHTML=`<section class="panel"><h2>Write a poem ✍️</h2><input id="pt" class="select" placeholder="Poem title"><textarea id="pb" class="select" rows="12" placeholder="Let your words out..."></textarea><button onclick="savePoem()">Save poem</button><p class="muted small">Saved on this device only.</p></section>`;
if(view==='my'){let poems=JSON.parse(localStorage.getItem('mvpoems')||'[]');app.innerHTML=`<section class="panel"><h2>My Poems</h2>${poems.length?poems.map(p=>`<article class="panel"><h3>${esc(p.title)}</h3><div class="poem">${esc(p.body)}</div></article>`).join(''):'<p>Your saved poems will appear here.</p>'}</section>`}
if(view==='book')app.innerHTML=`<section class="panel"><h2 class="readerTitle">Beautifully Broken: Scars That Speak</h2><p>By Jacklynne Reenee Coles</p><p class="muted">Your original manuscript, organized into its five parts.</p><select class="select" id="part" onchange="showPart()"><option value="-1">Author's note & opening</option>${BOOK.parts.map((p,i)=>`<option value="${i}">Part ${i+1}: ${esc(p.title)}</option>`).join('')}</select><div id="bookcontent" class="poem">${esc(BOOK.front)}</div></section>`;
if(view==='free')app.innerHTML=`<section class="panel"><h2>Free Poetry ✨</h2><p class="muted">A few original sample poems to read.</p><article><h3>Moonlight</h3><div class="poem">The night holds quiet\\nlike a secret in its hands.\\nI leave a little light\\nfor the words I cannot say.</div></article><hr><article><h3>Little Things</h3><div class="poem">A soft breeze,\\na page turned,\\na thought becoming words.\\nSometimes that is enough.</div></article></section>`;
if(view==='community')app.innerHTML=`<section class="panel"><h2>Community 💜</h2><p>Community posting is not connected to other people yet. This prototype keeps posts on this device only.</p><textarea id="post" class="select" rows="4" placeholder="Share a thought or poem..."></textarea><button onclick="savePost()">Save locally</button><div id="posts"></div></section>`;
if(view==='messages')app.innerHTML=`<section class="panel"><h2>Messages 💌</h2><p>Messaging is a visual prototype only. It does not send messages to other users.</p><textarea id="msg" class="select" rows="4" placeholder="Write a message..."></textarea><button onclick="alert('This demo does not deliver messages. Real messaging needs accounts and a secure backend.')">Send demo message</button></section>`;
}
function go(v){view=v;render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));
function showPart(){let n=+document.getElementById('part').value;document.getElementById('bookcontent').textContent=n<0?BOOK.front:BOOK.parts[n].text}
function savePoem(){let title=document.getElementById('pt').value.trim(),body=document.getElementById('pb').value.trim();if(!title||!body)return alert('Add a title and poem first.');let a=JSON.parse(localStorage.getItem('mvpoems')||'[]');a.unshift({title,body});localStorage.setItem('mvpoems',JSON.stringify(a));alert('Saved on this device 💜');go('my')}
function savePost(){let t=document.getElementById('post').value.trim();if(!t)return;let a=JSON.parse(localStorage.getItem('mvposts')||'[]');a.unshift(t);localStorage.setItem('mvposts',JSON.stringify(a));document.getElementById('posts').innerHTML=a.map(x=>`<article class="panel">${esc(x)}</article>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></body></html>
